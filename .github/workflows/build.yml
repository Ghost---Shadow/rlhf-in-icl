name: Build the preprint and the blog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compile the preprint
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper

      - name: Upload the PDF
        uses: actions/upload-artifact@v7
        with:
          name: preprint
          path: paper/main.pdf

      - name: Assemble the site
        run: |
          mkdir -p site
          cp -r blog/. site/
          cp paper/main.pdf site/appeasing-the-machine-spirit.pdf
          cp paper/figures/accuracy.png site/accuracy.png
          touch site/.nojekyll

      - name: Publish to gh-pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
